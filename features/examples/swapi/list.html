<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Wars API</title>
  <link rel="manifest" href="../../../manifest.webmanifest">
  <link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../css/app.css">
  <link rel="stylesheet" href="swapi.css">
  <script type="module" src="../../../js/feature.js"></script>
  <script type="module" src="list.js"></script>
</head>
<body>
  <header class="app-bar">
    <a class="icon-btn" href="./" aria-label="Back to endpoints">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="app-bar__title" id="title">Star Wars API</h1>
  </header>

  <main class="container stack">
    <form id="search-form" role="search">
      <label class="visually-hidden" for="search" id="search-label">Search</label>
      <input class="search" id="search" type="search" placeholder="Search" autocomplete="off">
      <p class="swapi-status" id="status" aria-live="polite"></p>
    </form>

    <div id="results"></div>

    <nav class="swapi-pager" id="pager" aria-label="Pages" hidden>
      <button class="btn" id="prev" type="button">Previous</button>
      <span class="swapi-pager__label" id="page-label"></span>
      <button class="btn" id="next" type="button">Next</button>
    </nav>
  </main>
</body>
</html>
