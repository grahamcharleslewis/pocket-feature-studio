name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover features
        run: node scripts/build-features.mjs

      - name: Stamp service worker with build id
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA::12}/" sw.js

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js features.json .nojekyll css js icons features _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
